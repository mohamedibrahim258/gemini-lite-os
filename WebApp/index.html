<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Gemini Lite</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gemini Lite">
  <meta name="theme-color" content="#0B0F19">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #0B0F19;
      --surface: #131C2E;
      --surface-raised: #1A263D;
      --surface-input: #162033;
      --border: #233047;
      --accent: #3B82F6;
      --accent-hover: #60A5FA;
      --accent-dark: #1D4ED8;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-tertiary: #64748B;
      --user-gradient: linear-gradient(135deg, #2563EB, #1D4ED8);
      --star-gradient: linear-gradient(135deg, #60A5FA, #818CF8, #38BDF8);
      --error: #EF4444;
      --success: #10B981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text-primary);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .header-titles h1 {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .model-chip {
      font-size: 10px;
      font-weight: 700;
      background: var(--surface-raised);
      color: var(--accent-hover);
      padding: 2px 6px;
      border-radius: 6px;
      font-family: monospace;
    }
    .status-sub {
      font-size: 11px;
      color: var(--success);
    }
    .status-sub.warning { color: #F59E0B; }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn:active {
      transform: scale(0.95);
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 14px 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .welcome-card {
      margin: auto 0;
      text-align: center;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .welcome-sparkle {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--surface-raised);
      border: 1px solid rgba(59, 130, 246, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }
    .welcome-title {
      font-size: 19px;
      font-weight: 700;
    }
    .welcome-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.4;
      max-width: 300px;
    }
    .quick-chips-container {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 6px 14px;
      background: var(--surface);
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .quick-chips-container::-webkit-scrollbar { display: none; }
    .chip-btn {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 12px;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .chip-btn:active { background: var(--border); }
    .msg-row {
      display: flex;
      gap: 8px;
      max-width: 100%;
    }
    .msg-row.user {
      justify-content: flex-end;
    }
    .user-content {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      max-width: 85%;
    }
    .user-bubble {
      background: var(--user-gradient);
      color: #FFF;
      padding: 10px 14px;
      border-radius: 18px 18px 4px 18px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }
    .attached-preview-thumb {
      max-width: 140px;
      max-height: 140px;
      border-radius: 12px;
      border: 1px solid var(--border);
      object-fit: cover;
      cursor: pointer;
    }
    .model-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .model-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 88%;
    }
    .model-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
      padding: 12px 14px;
      font-size: 15px;
      line-height: 1.45;
      color: var(--text-primary);
      word-break: break-word;
    }
    .model-bubble pre {
      background: #080C14;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin: 8px 0;
      overflow-x: auto;
      font-family: monospace;
      font-size: 13px;
      position: relative;
    }
    .model-bubble code {
      font-family: monospace;
      background: rgba(255,255,255,0.08);
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 13px;
    }
    .copy-code-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      color: var(--accent-hover);
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .msg-meta {
      font-size: 10px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 4px;
    }
    .action-link {
      color: var(--text-secondary);
      cursor: pointer;
      text-decoration: none;
    }
    .input-section {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .pre-upload-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .thumb-wrap {
      position: relative;
      width: 54px;
      height: 54px;
    }
    .thumb-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--accent);
    }
    .del-thumb-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 18px;
      height: 18px;
      background: var(--error);
      color: white;
      border-radius: 50%;
      border: none;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .text-box {
      flex: 1;
      background: var(--surface-input);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }
    .text-box:focus { border-color: var(--accent); }
    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }
    .send-btn:disabled {
      background: var(--surface-raised);
      color: var(--text-tertiary);
      cursor: not-allowed;
    }
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .form-input, .form-textarea, .form-select {
      background: var(--surface-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
    }
    .form-textarea { resize: vertical; min-height: 80px; }
    .btn-row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }
    .btn-secondary {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--accent);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="logo-badge">✨</div>
      <div class="header-titles">
        <h1>Gemini Lite <span class="model-chip" id="current-model-tag">2.0-flash</span></h1>
        <div class="status-sub" id="status-tag">Готов к работе</div>
      </div>
    </div>
    <button class="icon-btn" id="open-settings-btn" title="Настройки">⚙️</button>
  </header>

  <div id="chat-container">
    <div class="welcome-card" id="welcome-card">
      <div class="welcome-sparkle">✨</div>
      <div class="welcome-title">Gemini Lite для iPhone 7+</div>
      <div class="welcome-subtitle">Решай задачи с фото, проверяй ошибки и составляй конспекты за секунды</div>
    </div>
  </div>

  <div class="quick-chips-container">
    <button class="chip-btn" onclick="applyQuickPrompt('Пожалуйста, реши задачу на фото/в тексте подробно по шагам: 1. Дано; 2. Необходимые формулы; 3. Ход решения; 4. Итоговый ответ.')">📐 Реши задачу</button>
    <button class="chip-btn" onclick="applyQuickPrompt('Внимательно проверь решение или текст на ошибки. Покажи где ошибка и как правильно.')">🔍 Найди ошибку</button>
    <button class="chip-btn" onclick="applyQuickPrompt('Объясни эту тему простыми словами на понятных жизненных примерах.')">💡 Объясни просто</button>
    <button class="chip-btn" onclick="applyQuickPrompt('Составь краткий конспект: главное определение, тезисы списком и формулы без воды.')">📝 Конспект</button>
    <button class="chip-btn" onclick="applyQuickPrompt('Переведи этот текст на грамотный русский язык с сохранением терминологии.')">🌐 Перевод</button>
    <button class="chip-btn" onclick="applyQuickPrompt('Напиши понятный код для решения этой задачи с комментариями на русском.')">💻 Код</button>
  </div>

  <div class="input-section">
    <div class="pre-upload-row hidden" id="pre-upload-row"></div>
    <div class="input-row">
      <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">
      <input type="file" id="gallery-input" accept="image/*" class="hidden">

      <button class="icon-btn" id="attach-btn" title="Прикрепить фото">📷</button>
      <input type="text" class="text-box" id="user-input" placeholder="Задайте вопрос или отправьте фото..." autocomplete="off">
      <button class="send-btn" id="send-btn" disabled>➔</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay hidden" id="settings-modal">
    <div class="modal-card">
      <h3 style="font-size: 16px; font-weight: 700;">Настройки Gemini</h3>
      
      <div class="form-group">
        <label>Google Gemini API Ключ</label>
        <input type="password" class="form-input" id="api-key-input" placeholder="AIzaSy...">
        <a href="https://aistudio.google.com/app/apikey" target="_blank" style="font-size: 11px; color: var(--accent-hover); text-decoration: none;">Получить бесплатный ключ в Google AI Studio ↗</a>
      </div>

      <div class="form-group">
        <label>Модель нейросети</label>
        <select class="form-select" id="model-select">
          <option value="gemini-2.0-flash">Gemini 2.0 Flash (Рекомендуется)</option>
          <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash Lite (Быстрый)</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash (Стабильный)</option>
          <option value="gemini-1.5-pro">Gemini 1.5 Pro (Сложные задачи/ВУЗ)</option>
          <option value="custom">Ввести свою модель...</option>
        </select>
        <input type="text" class="form-input hidden" id="custom-model-input" placeholder="например: gemini-2.5-flash">
      </div>

      <div class="form-group">
        <label>Системный промпт (Инструкция)</label>
        <textarea class="form-textarea" id="system-prompt-input" placeholder="Оставьте пустым или укажите роль репетитора..."></textarea>
      </div>

      <div class="btn-row">
        <button class="btn-secondary" onclick="clearHistory()">Очистить чат</button>
        <button class="btn-primary" onclick="saveSettings()">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    let attachedImages = [];
    let chatHistory = [];

    const apiKeyInput = document.getElementById('api-key-input');
    const modelSelect = document.getElementById('model-select');
    const customModelInput = document.getElementById('custom-model-input');
    const systemPromptInput = document.getElementById('system-prompt-input');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const chatContainer = document.getElementById('chat-container');
    const welcomeCard = document.getElementById('welcome-card');
    const settingsModal = document.getElementById('settings-modal');
    const currentModelTag = document.getElementById('current-model-tag');
    const statusTag = document.getElementById('status-tag');
    const preUploadRow = document.getElementById('pre-upload-row');

    // Load settings from localStorage
    function loadSettings() {
      const key = localStorage.getItem('gemini_api_key') || '';
      const model = localStorage.getItem('gemini_model') || 'gemini-2.0-flash';
      const customModel = localStorage.getItem('gemini_custom_model') || '';
      const sysPrompt = localStorage.getItem('gemini_system_prompt') || 'Ты умный, опытный репетитор по школьным и ВУЗ предметам. Пошагово объясняй решения, формулы и выделяй ответ.';

      apiKeyInput.value = key;
      systemPromptInput.value = sysPrompt;

      if (['gemini-2.0-flash', 'gemini-2.0-flash-lite', 'gemini-1.5-flash', 'gemini-1.5-pro'].includes(model)) {
        modelSelect.value = model;
        customModelInput.classList.add('hidden');
      } else {
        modelSelect.value = 'custom';
        customModelInput.value = model;
        customModelInput.classList.remove('hidden');
      }
      updateHeaderStatus();
    }

    function getActiveModel() {
      if (modelSelect.value === 'custom') {
        return customModelInput.value.trim() || 'gemini-2.0-flash';
      }
      return modelSelect.value;
    }

    function updateHeaderStatus() {
      const key = localStorage.getItem('gemini_api_key') || '';
      const model = getActiveModel();
      currentModelTag.innerText = model.replace('gemini-', '');
      if (!key) {
        statusTag.innerText = 'Требуется API ключ';
        statusTag.className = 'status-sub warning';
      } else {
        statusTag.innerText = 'Готов к работе';
        statusTag.className = 'status-sub';
      }
    }

    function saveSettings() {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
      const model = getActiveModel();
      localStorage.setItem('gemini_model', model);
      if (modelSelect.value === 'custom') {
        localStorage.setItem('gemini_custom_model', customModelInput.value.trim());
      }
      localStorage.setItem('gemini_system_prompt', systemPromptInput.value.trim());
      settingsModal.classList.add('hidden');
      updateHeaderStatus();
    }

    modelSelect.addEventListener('change', () => {
      if (modelSelect.value === 'custom') {
        customModelInput.classList.remove('hidden');
      } else {
        customModelInput.classList.add('hidden');
      }
    });

    document.getElementById('open-settings-btn').addEventListener('click', () => {
      settingsModal.classList.remove('hidden');
    });

    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) settingsModal.classList.add('hidden');
    });

    // Attach Photo (Camera vs Gallery)
    document.getElementById('attach-btn').addEventListener('click', () => {
      const choice = confirm("Нажмите OK, чтобы открыть камеру, или Отмена, чтобы выбрать из галереи.");
      if (choice) {
        document.getElementById('camera-input').click();
      } else {
        document.getElementById('gallery-input').click();
      }
    });

    function handleFilePick(e) {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          attachedImages.push(ev.target.result);
          renderThumbnails();
          checkSendable();
        };
        reader.readAsDataURL(file);
      });
      e.target.value = '';
    }

    document.getElementById('camera-input').addEventListener('change', handleFilePick);
    document.getElementById('gallery-input').addEventListener('change', handleFilePick);

    function renderThumbnails() {
      if (attachedImages.length === 0) {
        preUploadRow.classList.add('hidden');
        preUploadRow.innerHTML = '';
        return;
      }
      preUploadRow.classList.remove('hidden');
      preUploadRow.innerHTML = attachedImages.map((src, idx) => `
        <div class="thumb-wrap">
          <img src="${src}">
          <button class="del-thumb-btn" onclick="removeThumb(${idx})">×</button>
        </div>
      `).join('');
    }

    window.removeThumb = (idx) => {
      attachedImages.splice(idx, 1);
      renderThumbnails();
      checkSendable();
    };

    function checkSendable() {
      sendBtn.disabled = (userInput.value.trim() === '' && attachedImages.length === 0);
    }
    userInput.addEventListener('input', checkSendable);

    window.applyQuickPrompt = (prompt) => {
      userInput.value = prompt;
      userInput.focus();
      checkSendable();
    };

    function clearHistory() {
      chatHistory = [];
      chatContainer.innerHTML = `
        <div class="welcome-card" id="welcome-card">
          <div class="welcome-sparkle">✨</div>
          <div class="welcome-title">Gemini Lite для iPhone 7+</div>
          <div class="welcome-subtitle">Решай задачи с фото, проверяй ошибки и составляй конспекты за секунды</div>
        </div>
      `;
      settingsModal.classList.add('hidden');
    }

    // Markdown simple renderer
    function formatMarkdown(text) {
      let escaped = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      // Code blocks
      escaped = escaped.replace(/```([a-zA-Z0-9]*)\n([\s\S]*?)```/g, (match, lang, code) => {
        return `<pre><code>${code.trim()}</code><button class="copy-code-btn" onclick="navigator.clipboard.writeText(this.previousElementSibling.innerText); this.innerText='✓'; setTimeout(()=>this.innerText='Копия', 1500);">Копия</button></pre>`;
      });

      // Inline code
      escaped = escaped.replace(/`([^`]+)`/g, "<code>$1</code>");
      // Bold
      escaped = escaped.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      // Newlines
      escaped = escaped.replace(/\n/g, "<br>");
      return escaped;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      const currentImages = [...attachedImages];
      if (!text && currentImages.length === 0) return;

      const apiKey = localStorage.getItem('gemini_api_key') || '';
      if (!apiKey) {
        alert("Пожалуйста, укажите ваш Google Gemini API ключ в настройках (⚙️).");
        settingsModal.classList.remove('hidden');
        return;
      }

      // Hide welcome card
      const welcome = document.getElementById('welcome-card');
      if (welcome) welcome.remove();

      // Append User message
      const userDiv = document.createElement('div');
      userDiv.className = 'msg-row user';
      userDiv.innerHTML = `
        <div class="user-content">
          ${currentImages.map(img => `<img src="${img}" class="attached-preview-thumb">`).join('')}
          ${text ? `<div class="user-bubble">${text.replace(/\n/g, '<br>')}</div>` : ''}
          <div class="msg-meta">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
        </div>
      `;
      chatContainer.appendChild(userDiv);

      // Append Pending Model Bubble
      const pendingDiv = document.createElement('div');
      pendingDiv.className = 'msg-row';
      pendingDiv.innerHTML = `
        <div class="model-avatar">✨</div>
        <div class="model-content">
          <div class="model-bubble"><i>Gemini думает...</i></div>
        </div>
      `;
      chatContainer.appendChild(pendingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      // Reset inputs
      userInput.value = '';
      attachedImages = [];
      renderThumbnails();
      checkSendable();

      // Build Gemini API Payload
      const model = getActiveModel();
      const sysPrompt = localStorage.getItem('gemini_system_prompt') || '';
      
      const parts = [];
      const promptText = text || (currentImages.length > 0 ? "Пожалуйста, подробно разбери и реши задание на прикрепленном изображении по шагам." : "Привет!");
      parts.push({ text: promptText });

      currentImages.forEach(dataUrl => {
        const base64Data = dataUrl.split(',')[1];
        const mime = dataUrl.substring(dataUrl.indexOf(':') + 1, dataUrl.indexOf(';'));
        parts.push({
          inline_data: {
            mime_type: mime || "image/jpeg",
            data: base64Data
          }
        });
      });

      const contents = [...chatHistory, { role: "user", parts: parts }];
      const body = { contents: contents };
      if (sysPrompt.trim()) {
        body.system_instruction = { parts: [{ text: sysPrompt.trim() }] };
      }

      try {
        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.error ? data.error.message : `Ошибка сервера (код ${resp.status})`);
        }

        const replyText = data.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || 'Пустой ответ от нейросети.';

        // Update bubble
        pendingDiv.innerHTML = `
          <div class="model-avatar">✨</div>
          <div class="model-content">
            <div class="model-bubble">${formatMarkdown(replyText)}</div>
            <div class="msg-meta">
              <span>${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
              <a class="action-link" onclick="navigator.clipboard.writeText(decodeURIComponent('${encodeURIComponent(replyText)}')); alert('Ответ скопирован!');">Копировать</a>
            </div>
          </div>
        `;

        // Save into history
        chatHistory.push({ role: "user", parts: [{ text: promptText }] });
        chatHistory.push({ role: "model", parts: [{ text: replyText }] });

      } catch (err) {
        pendingDiv.innerHTML = `
          <div class="model-avatar">⚠️</div>
          <div class="model-content">
            <div class="model-bubble" style="border-color: rgba(239, 68, 68, 0.4); color: #FCA5A5;">
              <strong>Ошибка:</strong> ${err.message}
            </div>
          </div>
        `;
      }

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    loadSettings();
  </script>
</body>
</html>
